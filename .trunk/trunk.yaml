version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.11.0

lint:
  enabled:
    - markdown-link-check@3.14.1
    - hadolint@2.15.1
    - codespell@2.4.3
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - gofmt@1.20.4
    - golangci-lint@2.13.2
    - markdownlint@0.45.0
    - prettier@3.6.2
    - yamllint@1.38.0
  ignore:
    - linters: [markdown-link-check]
      paths:
        - docs/docs/api-reference/**
    - linters: [prettier]
      paths:
        - docs/docs/**
    - linters: [yamllint, prettier]
      paths:
        - charts/aiven-operator/templates/*.yaml
    - linters:
        - markdownlint
      paths:
        - .trunk/**
        - docs/docs/**

runtimes:
  enabled:
    - go@1.22.4
    - node@22.16.0
    - python@3.14.4

actions:
  disabled:
    - trunk-announce
  enabled:
    - commitlint
    - trunk-upgrade-available
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
